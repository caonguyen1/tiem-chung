<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Popup chào mừng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=block" />
<link rel="stylesheet" href="art.css" />
<style>
  /* Khung 540×540, xuất ở 2x thành 1080×1080. */
  .bg { position: absolute; inset: 0; background: linear-gradient(165deg, #f6f8fe 0%, #e3e8f6 48%, #c9d3f1 100%); }
  .waves { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plus { position: absolute; }
  .kicker { position: absolute; z-index: 2; left: 34px; top: 34px; display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 22px 0 8px; border-radius: 999px; background: #fff; color: var(--navy); font-size: 17px; font-weight: 700; box-shadow: 0 10px 24px -14px rgb(28 42 102 / 0.5); }
  .kicker img { width: 32px; height: 32px; object-fit: contain; }
  h1 { position: absolute; z-index: 2; left: 34px; top: 104px; color: var(--navy); font-weight: 800; letter-spacing: -0.025em; line-height: 1; }
  h1 span { display: block; font-size: 38px; }
  h1 strong { position: relative; display: inline-block; margin-top: 12px; padding: 4px 14px 8px 10px; font-size: 54px; font-weight: 900; color: var(--navy-900); }
  h1 strong svg { position: absolute; z-index: -1; left: -14px; top: 0; width: calc(100% + 24px); height: 100%; overflow: visible; }
  .photo { position: absolute; left: 196px; top: 236px; width: 470px; height: 470px; border-radius: 50%; overflow: hidden; border: 9px solid #fff; box-shadow: 0 24px 50px -24px rgb(28 42 102 / 0.6); }
  /* Phần thấy được chỉ là nửa trên vòng tròn, nên đẩy ảnh lên để bảng hiệu và cửa nằm trong khung. */
  .photo img { position: absolute; left: -6%; top: -60%; width: 136%; height: 136%; object-fit: cover; }
  .corner { position: absolute; right: 0; bottom: 0; width: 200px; height: 64px; }
  .sticker { position: absolute; z-index: 3; left: 40px; top: 254px; width: 178px; height: 178px; display: grid; place-content: center; text-align: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe94d, #fadc00 60%, #f2cf00); color: var(--navy); font-weight: 800; line-height: 1.05; transform: rotate(-9deg); box-shadow: 0 18px 30px -16px rgb(28 42 102 / 0.55); }
  .sticker small { font-size: 22px; font-weight: 700; }
  .sticker b { display: block; margin: 4px 0; font-size: 31px; letter-spacing: -0.02em; }
  .sticker span { font-size: 21px; font-weight: 700; }
  .sticker svg { width: 96px; height: 14px; margin: 6px auto 0; }
  .spark { position: absolute; z-index: 3; }
  .cta { position: absolute; z-index: 3; left: 34px; bottom: 44px; display: inline-flex; align-items: center; gap: 16px; height: 62px; padding: 0 9px 0 32px; border-radius: 999px; background: linear-gradient(180deg, #324cbd, #283c96); color: #fff; font-size: 23px; font-weight: 800; box-shadow: 0 7px 0 #fadc00, 0 18px 28px -14px rgb(28 42 102 / 0.7); }
  .cta i { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: #fff; color: var(--navy); }
  .cta svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div class="banner">
  <div class="bg"></div>
  <svg class="waves" viewBox="0 0 540 540" preserveAspectRatio="none">
    <path d="M0 210C120 160 230 250 360 190S520 110 540 120V0H0Z" fill="#fff" fill-opacity=".45"/>
    <path d="M0 470C90 430 150 500 260 480S420 410 540 430V540H0Z" fill="#fff" fill-opacity=".35"/>
  </svg>
  <svg class="plus" style="left:456px;top:84px;width:52px" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z" fill="#fff" fill-opacity=".8"/></svg>
  <svg class="plus" style="left:432px;top:156px;width:24px" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z" fill="#fff" fill-opacity=".7"/></svg>
  <svg class="plus" style="left:24px;top:420px;width:34px" viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6Z" fill="#fff" fill-opacity=".7"/></svg>

  <span class="kicker"><img src="../../public/images/logo-mark.png" alt="" />Trung tâm Tiêm chủng Tâm Trí</span>
  <h1><span>Chính thức đón khách</span><strong>Tâm Trí Quy Nhơn<svg viewBox="0 0 100 40" preserveAspectRatio="none"><path d="M3 9C20 4 60 2 97 6c3 9 2 20-1 28C62 38 26 39 2 35-1 26 0 16 3 9Z" fill="#FADC00"/></svg></strong></h1>

  <div class="photo"><img src="../../public/images/facade.jpg" alt="" /></div>
  <svg class="corner" viewBox="0 0 260 120" preserveAspectRatio="none"><path d="M0 120C80 110 150 70 260 10V120Z" fill="#FADC00"/></svg>

  <div class="sticker"><small>Mở cửa</small><b>7:30–20:00</b><span>hằng ngày</span><svg viewBox="0 0 96 14"><path d="M4 10C30 3 64 2 92 6" stroke="#283C96" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg></div>
  <svg class="spark" style="left:18px;top:236px;width:46px" viewBox="0 0 40 40"><path d="M10 10l10 8M6 24h12M22 2l2 12" stroke="#FADC00" stroke-width="4.5" stroke-linecap="round"/></svg>
  <svg class="spark" style="left:448px;top:118px;width:50px" viewBox="0 0 40 40"><path d="M8 32 20 16M16 36l18-8M6 18l6-12" stroke="#FADC00" stroke-width="4.5" stroke-linecap="round"/></svg>

  <span class="cta">Đặt lịch tiêm<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></i></span>
</div>
</body>
</html>
