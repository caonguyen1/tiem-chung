<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Banner chính – Trung tâm Tiêm chủng Tâm Trí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=block" />
<link rel="stylesheet" href="art.css" />
<link rel="stylesheet" href="../../public/prototypes/banner-c.css" />
<style>
  /* PC 800×420 (xuất 2x), mobile 343×440 (xuất 3x), bản mobile đủ nội dung như PC. Nút bấm và chấm chuyển slide là HTML đặt
     lên ảnh ở trang, nên góc dưới bên trái (và góc trên bên phải bản mobile) để trống. */
  .bn { border-radius: 0; font-family: inherit; }
  .bn .pill.small { height: 30px; padding: 0 11px 0 4px; font-size: 12.5px; }
  .bn .pill.small svg { width: 22px; height: 22px; }

  .mb .bn { width: 343px; height: 440px; }
  .mb .bn .copy { top: 16px; left: 16px; right: 16px; width: auto !important; }
  .mb .bn .kicker { height: 26px; padding-right: 10px; font-size: 11px; }
  .mb .bn .kicker img { width: 20px; height: 20px; }
  .mb .bn h2 { margin-top: 12px; }
  .mb .bn .t1 { font-size: 21px !important; }
  .mb .bn .t2 { margin-top: 4px; font-size: 40px !important; }
  .mb .bn .desc { max-width: 300px; margin-top: 8px; font-size: 13px !important; line-height: 1.4; }
  .mb .bn .pills { flex-direction: column; align-items: flex-start; gap: 6px !important; margin-top: 14px; }
  .mb .bn .pill.small { height: 26px; padding-right: 9px; font-size: 11px; }
  .mb .bn .pill.small svg { width: 20px; height: 20px; flex-shrink: 0; }
  /* Chip dài xuống 2 dòng để cột chip hẹp, chừa chỗ cho ảnh tròn bên phải. */
  .mb .bn .pill.small:nth-child(3) { height: auto; max-width: 116px; padding-top: 5px; padding-bottom: 5px; line-height: 1.2; }
  .mb .bn .photo { top: 184px !important; right: 12px !important; width: 160px !important; height: 160px !important; border-width: 6px; }
  .mb .bn .v1 { top: 168px !important; right: 2px !important; width: 36px !important; }
  .mb .bn .v2 { top: 280px !important; right: 0 !important; width: 42px !important; }
  .mb .bn .sticker { top: 284px !important; right: auto !important; left: 92px; width: 86px; height: 86px; font-size: 10px; }
  .mb .bn .sticker b { font-size: 15px !important; }
</style>
</head>
<body>
<div class="bn bn-pkg">
  <div class="bg"></div>
  <div class="copy" style="width:440px">
    <span class="kicker"><img src="../../public/images/logo-mark.png" alt="" />Hệ sinh thái y tế Sản – Nhi Tâm Trí</span>
    <h2><span class="t1" style="font-size:33px">Trung tâm Tiêm chủng</span><span class="t2" style="font-size:60px">Tâm Trí</span></h2>
    <p class="desc" style="font-size:15px">Cùng hệ thống Phòng khám Sản – Nhi và Nhà thuốc Tâm Trí.</p>
    <div class="pills" style="gap:6px">
      <span class="pill small"><i data-icon="pregnancy"></i>Bác sĩ Sản khoa</span>
      <span class="pill small"><i data-icon="baby"></i>Bác sĩ Nhi khoa</span>
      <span class="pill small"><i data-icon="stethoscope"></i>Khám sàng lọc trước tiêm</span>
    </div>
  </div>
  <div class="photo" style="right:44px;top:50px;width:270px;height:270px"><img src="../../public/images/facade.jpg" alt="" style="object-position:45% 60%" /></div>
  <i class="vial v1" data-vial="Hexaxim|#fadc00" style="right:290px;top:70px;width:58px;transform:rotate(-12deg)"></i>
  <i class="vial v2" data-vial="Prevenar|#4a62cf" style="right:30px;top:226px;width:70px;transform:rotate(10deg)"></i>
  <div class="sticker" style="right:236px;top:282px"><span>Mở cửa<b style="font-size:19px">7:30–20:00</b>hằng ngày</span></div>
</div>
<script>document.body.className = new URLSearchParams(location.search).get("v") || "pc";</script>
<script src="../../public/prototypes/icons.js"></script>
<script src="../../public/prototypes/banner-c.js"></script>
</body>
</html>
