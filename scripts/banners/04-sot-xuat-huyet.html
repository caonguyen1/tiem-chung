<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="banner.css" />
<style>
  .banner { background: linear-gradient(120deg, #f2f4fb 0%, #e3e8f6 100%); }
  .alert { color: #d9480f; }

  /* ---------- PC ---------- */
  .pc .copy { position: absolute; left: 190px; top: 100px; width: 900px; z-index: 2; }
  .pc .pill { padding: 10px 22px; font-size: 20px; background: #d9480f; color: #fff; }
  .pc .pill .dot { background: #fff; }
  .pc h1 { margin-top: 26px; font-size: 92px; line-height: 1; font-weight: 820; letter-spacing: -0.02em; color: var(--navy); }
  .pc .sub { margin-top: 22px; font-size: 30px; color: #3d4670; max-width: 760px; line-height: 1.4; }
  .pc .sub b { color: var(--navy); }
  .pc .cta { margin-top: 38px; padding: 10px 12px 10px 34px; font-size: 24px; background: var(--navy); color: #fff; box-shadow: 0 16px 30px -14px rgb(40 60 150 / 0.8); }
  .pc .cta .arrow { width: 50px; height: 50px; background: var(--sun); color: var(--navy-900); font-size: 26px; }
  .pc .hero-icon { position: absolute; right: 260px; top: 50%; transform: translateY(-50%); width: 560px; height: 560px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 50px 90px -50px rgb(20 30 74 / 0.6); }
  .pc .ring { position: absolute; right: 200px; top: 50%; transform: translateY(-50%); width: 680px; height: 680px; border-radius: 50%; border: 3px dashed rgb(40 60 150 / 0.25); }
  .pc .vial { position: absolute; right: 180px; bottom: 90px; padding: 18px 26px 18px 18px; display: flex; align-items: center; gap: 14px; background: var(--navy); color: #fff; border-radius: 24px; box-shadow: 0 24px 40px -20px rgb(20 30 74 / 0.6); }
  .pc .vial b { display: block; font-size: 28px; }
  .pc .vial span { font-size: 18px; color: #c5cfec; }

  /* ---------- Mobile ---------- */
  .mb .copy { position: absolute; left: 28px; top: 30px; right: 28px; z-index: 2; }
  .mb .pill { padding: 6px 14px; font-size: 12px; background: #d9480f; color: #fff; }
  .mb .pill .dot { background: #fff; width: 7px; height: 7px; }
  .mb h1 { margin-top: 14px; font-size: 42px; line-height: 1; font-weight: 820; letter-spacing: -0.02em; color: var(--navy); }
  .mb .sub { margin-top: 10px; font-size: 16px; color: #3d4670; width: 260px; line-height: 1.4; }
  .mb .hero-icon { position: absolute; right: -40px; bottom: -40px; width: 320px; height: 320px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
  .mb .cta { position: absolute; left: 28px; bottom: 30px; padding: 6px 7px 6px 20px; font-size: 15px; background: var(--navy); color: #fff; z-index: 2; }
  .mb .cta .arrow { width: 32px; height: 32px; background: var(--sun); color: var(--navy-900); font-size: 17px; }
</style>
</head>
<body>
<div class="banner">
  <svg class="arcs only-pc" viewBox="0 0 1920 710" preserveAspectRatio="none">
    <path d="M1060 760C1120 420 1300 140 1700 -20" stroke="#FADC00" stroke-width="24" fill="none"/>
  </svg>

  <div class="copy">
    <span class="pill"><span class="dot"></span>Cảnh báo mùa dịch</span>
    <h1>Sốt xuất huyết<br />vào mùa cao điểm</h1>
    <p class="sub only-pc">Tiêm vắc xin <b>Qdenga</b> — phòng cả 4 tuýp virus Dengue, cho trẻ từ 4 tuổi và người lớn.</p>
    <p class="sub only-mb">Tiêm Qdenga, phòng cả 4 tuýp virus Dengue.</p>
    <span class="cta only-pc">Đặt lịch tiêm <span class="arrow">→</span></span>
  </div>

  <div class="ring only-pc"></div>
  <div class="hero-icon only-pc"><svg width="400" height="400" viewBox="0 0 64 64" fill="none"><g stroke="#283C96" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="22.5" cy="25" rx="9.5" ry="4.2" transform="rotate(-28 22.5 25)" fill="#F2F4FB"/><ellipse cx="41.5" cy="25" rx="9.5" ry="4.2" transform="rotate(28 41.5 25)" fill="#F2F4FB"/><ellipse cx="32" cy="39" rx="4.5" ry="10" fill="#FADC00"/><circle cx="32" cy="24.5" r="3.6" fill="#fff"/><path d="M32 21V10M28.5 33l-8.5 3.5-3 5.5M35.5 33l8.5 3.5 3 5.5M29 38l-6.5 8.5M35 38l6.5 8.5"/></g></svg></div>
  <div class="vial only-pc"><span data-icon="syringe" data-size="64"></span><div><b>Qdenga</b><span>Takeda · Đức</span></div></div>

  <div class="hero-icon only-mb"><svg width="230" height="230" viewBox="0 0 64 64" fill="none"><g stroke="#283C96" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="22.5" cy="25" rx="9.5" ry="4.2" transform="rotate(-28 22.5 25)" fill="#F2F4FB"/><ellipse cx="41.5" cy="25" rx="9.5" ry="4.2" transform="rotate(28 41.5 25)" fill="#F2F4FB"/><ellipse cx="32" cy="39" rx="4.5" ry="10" fill="#FADC00"/><circle cx="32" cy="24.5" r="3.6" fill="#fff"/><path d="M32 21V10M28.5 33l-8.5 3.5-3 5.5M35.5 33l8.5 3.5 3 5.5M29 38l-6.5 8.5M35 38l6.5 8.5"/></g></svg></div>
  <span class="cta only-mb">Đặt lịch tiêm <span class="arrow">→</span></span>
</div>
<script src="icons.js"></script>
</body>
</html>
