<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="banner.css" />
<style>
  .banner { background: linear-gradient(100deg, #fffbe0 0%, #fff7c2 40%, #fdf3b0 100%); }

  /* ---------- PC ---------- */
  .pc .copy { position: absolute; left: 190px; top: 66px; width: 860px; z-index: 2; }
  .pc .pill { padding: 8px 20px; font-size: 18px; background: #fff; color: var(--navy); box-shadow: 0 10px 24px -14px rgb(20 30 74 / 0.4); }
  .pc .kicker { margin-top: 20px; font-size: 28px; font-weight: 600; color: #3d4670; }
  .pc h1 { margin-top: 4px; font-size: 80px; line-height: 0.98; font-weight: 820; letter-spacing: -0.02em; color: var(--navy); }
  .pc .quote { margin-top: 18px; max-width: 660px; font-size: 22px; line-height: 1.45; color: #3d4670; padding-left: 20px; border-left: 5px solid var(--navy); }
  .pc .cta { margin-top: 26px; padding: 8px 10px 8px 30px; font-size: 22px; background: var(--navy); color: #fff; box-shadow: 0 16px 30px -14px rgb(40 60 150 / 0.8); }
  .pc .cta .arrow { width: 44px; height: 44px; background: var(--sun); color: var(--navy-900); font-size: 22px; }
  .pc .disc { position: absolute; right: 150px; top: -200px; width: 780px; height: 780px; border-radius: 50%; background: #fff; opacity: 0.55; }
  .pc .frame { position: absolute; right: 260px; bottom: 0; width: 500px; height: 516px; border-radius: 250px 250px 0 0; }
  .pc .tag { position: absolute; right: 150px; bottom: 80px; padding: 16px 22px; background: #fff; border-radius: 20px; box-shadow: 0 24px 40px -20px rgb(20 30 74 / 0.45); }
  .pc .tag b { display: block; font-size: 22px; color: var(--navy-900); }
  .pc .tag span { font-size: 16px; color: #5b6382; }
  .pc .icons { position: absolute; right: 790px; top: 92px; display: flex; flex-direction: column; gap: 18px; }

  /* ---------- Mobile ---------- */
  .mb .copy { position: absolute; left: 28px; top: 30px; width: 290px; z-index: 2; }
  .mb .pill { padding: 6px 14px; font-size: 12px; background: #fff; color: var(--navy); }
  .mb .kicker { margin-top: 14px; font-size: 18px; font-weight: 600; color: #3d4670; }
  .mb h1 { margin-top: 4px; font-size: 46px; line-height: 0.98; font-weight: 820; letter-spacing: -0.02em; color: var(--navy); }
  .mb .disc { position: absolute; right: -150px; bottom: -150px; width: 480px; height: 480px; border-radius: 50%; background: #fff; opacity: 0.6; }
  .mb .frame { position: absolute; right: -10px; bottom: 0; width: 290px; height: 330px; border-radius: 145px 145px 0 0; }
  .mb .cta { position: absolute; left: 28px; bottom: 30px; padding: 6px 7px 6px 20px; font-size: 15px; background: var(--navy); color: #fff; z-index: 2; }
  .mb .cta .arrow { width: 32px; height: 32px; background: var(--sun); color: var(--navy-900); font-size: 17px; }
  .mb .icons { position: absolute; left: 28px; top: 300px; display: flex; gap: 10px; }
</style>
</head>
<body>
<div class="banner">
  <div class="disc"></div>
  <svg class="arcs only-pc" viewBox="0 0 1920 560" preserveAspectRatio="none">
    <path d="M1000 720C1060 420 1260 200 1560 120" stroke="#283C96" stroke-width="20" fill="none"/>
  </svg>

  <div class="copy">
    <span class="pill"><span class="dot"></span>Mẹ và bé là trọng tâm</span>
    <p class="kicker">Có bác sĩ Sản và Nhi</p>
    <h1>Đồng hành<br />từng mũi tiêm</h1>
    <p class="quote only-pc">Từ lúc chuẩn bị mang thai, trong thai kỳ đến những năm đầu đời — 100% được bác sĩ khám sàng lọc trước tiêm.</p>
    <span class="cta only-pc">Đặt lịch tư vấn <span class="arrow">→</span></span>
  </div>

  <div class="icons only-pc">
    <span data-icon="pregnancy" data-size="100"></span>
    <span data-icon="baby" data-size="100"></span>
    <span data-icon="stethoscope" data-size="100"></span>
  </div>
  <div class="icons only-mb">
    <span data-icon="pregnancy" data-size="52"></span>
    <span data-icon="baby" data-size="52"></span>
  </div>

  <div class="photo frame" style="background-image:url('../../public/images/doctor-do-van-tam.jpg'); background-position: 50% 0%;"></div>
  <div class="tag only-pc"><b>BSCKII. Đỗ Văn Tâm</b><span>Giám đốc Hệ thống Y tế Tâm Trí</span></div>
  <span class="cta only-mb">Đặt lịch tư vấn <span class="arrow">→</span></span>
</div>
<script src="icons.js"></script>
</body>
</html>
